services:
  - type: web
    name: lms-studio-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run render-build
    startCommand: npm run render-start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lms-studio-db
          property: connectionString

databases:
  - name: lms-studio-db
    plan: free
    region: oregon
    databaseName: scorm_h5p_studio
    user: scorm_user
